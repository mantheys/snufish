# Solar neutrino measurements that discriminate Delta m^2_21, with sources.

sk_day_night:
  description: >
    Super-Kamiokande day-night asymmetry of the 8B elastic-scattering rate,
    all phases (5805 days), amplitude fit. SK convention A = (D - N) / ((D + N) / 2);
    SNUfish uses 2 (N - D) / (N + D) = -A.
  value: -0.0286
  stat: 0.0085
  syst: 0.0032
  site: Kamioka
  channel: es
  detector_material: water
  recoil_kinetic_threshold_MeV: 3.49     # analysis window 3.49-19.49 MeV electron kinetic energy (SK-IV)
  notes: the amplitude fit assumes the zenith shape of dm2_21 = 6.1e-5 eV^2; SK states similar conclusions hold over the region of interest
  source: Super-Kamiokande, arXiv:2312.12907, sec. VIII and summary

sk_sno_pee_quadratic:
  description: >
    Daytime nu_e survival probability of 8B neutrinos from SK + SNO spectra,
    P_ee(E) = c0 + c1 (E - 10 MeV) + c2 (E - 10 MeV)^2, E the neutrino energy in MeV.
  c: [0.308, -0.0044, 0.0016]
  errors: [0.015, 0.0034, 0.0017]
  correlation: [[1.0, -0.474, -0.394], [-0.474, 1.0, 0.391], [-0.394, 0.391, 1.0]]
  valid_MeV: [3.0, 15.0]
  source: Super-Kamiokande, arXiv:2312.12907, table VIII (SK+SNO row)

borexino_rates:
  description: Borexino pp, pep and 7Be interaction rates (counts per day per 100 t), with the inverse covariance used by Super-Kamiokande.
  rates: {pp: 134.0, pep: 2.43, Be7: 48.3}
  inverse_covariance: [[0.00647, -0.0126, -0.0170], [-0.0126, 6.36, -0.501], [-0.017, -0.501, 0.784]]
  source: Borexino (Nature 562, 505 (2018)), as used in arXiv:2312.12907 sec. VII D
  # each rate with its statistical and asymmetric systematic error, all recoil energies, high-metallicity CNO constraint
  measured:
    pp:  {value: 134.0, stat: 10.0, sys: [10.0, 6.0]}
    Be7: {value: 48.3, stat: 1.1, sys: [0.7, 0.4]}     # 862 + 384 keV lines
    pep: {value: 2.43, stat: 0.36, sys: [0.22, 0.15]}
  predicted_b16_gs98: {pp: 131.1, Be7: 47.9, pep: 2.74}   # Borexino's own prediction, same table
  exposure: {fiducial_t: 71.3, days: 1291.51}
  measured_source: Borexino Phase-II, arXiv:1707.09279, table II (Nature 562, 505 (2018))

sno_cc_nc:
  description: >
    SNO salt phase (391 live days), energy-unconstrained fit: the ratio of the CC to the NC 8B flux, i.e. the CC rate
    above the threshold over the CC rate without oscillations for the measured total flux.
  value: 0.340
  stat: 0.023
  syst: [0.031, 0.029]      # minus, plus; the paper notes the errors on the ratios are not Gaussian
  threshold_MeV: 5.5        # T_eff, the effective electron kinetic energy; fiducial R < 550 cm
  channel: cc_nue_d
  source: arXiv:nucl-ex/0502021, sec. XI

sk4_events:
  description: >
    Super-K IV, 2970 days: solar neutrino (8B + hep) ES events extracted in 3.49-19.49 MeV recoil kinetic energy, in the
    22.5 kt fiducial volume, after its selection (fig. 28 efficiency).
  events: 65443
  stat: [388, 390]          # minus, plus
  syst: 925
  fiducial_kt: 22.5
  days: 2970
  threshold_MeV: 3.49
  source: arXiv:2312.12907, sec. V B
