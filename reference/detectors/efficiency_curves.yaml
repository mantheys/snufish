# Detector efficiency curves read from published figures (not from tables: none is published as numbers).
# Each is binned: `edges_MeV` (observed energy; ES: electron kinetic energy) and the efficiency of each bin.
sk4_final:
  label: Super-K IV final sample (fig. 28)
  source: arXiv:2312.12907, fig. 28 ("Final sample", MC, 2970 days)
  method: >
    marker positions read from the figure's vector PostScript in the arXiv source (096.eps, ROOT 5.28): exact to the
    figure's drawing precision, 0.08 % in efficiency; the axes calibrated on its tick marks (0 and 100 %, 4 and 18 MeV)
  note: signal efficiency relative to 8B ES events triggered in the 22.5 kt fiducial volume, reconstructed recoil kinetic energy
