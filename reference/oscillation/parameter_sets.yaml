# Oscillation parameter sets, with their sources. Errors are 1 sigma, as
# [minus, plus] where asymmetric. Parameters a set does not determine
# (theta13, theta23, delta, dm2_31) are taken from `defaults`.
# Normal ordering throughout.

defaults:
  sin2_theta13: {value: 0.02195, error: [0.00058, 0.00054]}
  sin2_theta23: {value: 0.561, error: [0.015, 0.012]}
  delta_cp_deg: {value: 177.0, error: [20.0, 19.0]}
  dm2_31_eV2:   {value: 2.534e-3, error: [0.023e-3, 0.025e-3]}
  source: NuFIT 6.0, arXiv:2410.05380, table 1 (IC19 w/o SK-atm, NO)

sets:
  nufit60_global:
    label: NuFIT 6.0 global
    kind: global
    dm2_21_eV2:   {value: 7.49e-5, error: [0.19e-5, 0.19e-5]}
    sin2_theta12: {value: 0.307, error: [0.011, 0.012]}
    source: arXiv:2410.05380, table 1 (IC19 w/o SK-atm, NO)
  juno_2025:
    label: JUNO 2025 (59 days)
    kind: reactor
    dm2_21_eV2:   {value: 7.50e-5, error: [0.12e-5, 0.12e-5]}
    sin2_theta12: {value: 0.3092, error: [0.0087, 0.0087]}
    source: arXiv:2511.14593 (NO)
  kamland_2013:
    label: KamLAND
    kind: reactor
    dm2_21_eV2:   {value: 7.54e-5, error: [0.18e-5, 0.19e-5]}
    sin2_theta12: {value: 0.316, error: [0.026, 0.034]}
    source: KamLAND, Phys. Rev. D 88, 033001 (2013), values as quoted in arXiv:2312.12907 fig. 47
  solar_global_2024:
    label: All solar (SK 2024)
    kind: solar
    dm2_21_eV2:   {value: 6.10e-5, error: [0.81e-5, 0.95e-5]}
    sin2_theta12: {value: 0.306, error: [0.013, 0.013]}
    source: Super-Kamiokande, arXiv:2312.12907 (solar global analysis, sin2_theta13 = 0.0218 +- 0.0007)
  sk_sno_2024:
    label: SK + SNO (2024)
    kind: solar
    dm2_21_eV2:   {value: 6.10e-5, error: [0.75e-5, 1.04e-5]}
    sin2_theta12: {value: 0.305, error: [0.014, 0.014]}
    source: Super-Kamiokande, arXiv:2312.12907 (SK + SNO, independent of solar-model fluxes)
  solar_kamland_2024:
    label: Solar + KamLAND (SK 2024)
    kind: global
    dm2_21_eV2:   {value: 7.50e-5, error: [0.18e-5, 0.19e-5]}
    sin2_theta12: {value: 0.307, error: [0.012, 0.012]}
    source: Super-Kamiokande, arXiv:2312.12907
