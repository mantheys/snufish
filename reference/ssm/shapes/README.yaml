# Provenance of the solar neutrino spectral shapes (dN/dE per MeV, any normalisation;
# SNUfish normalises each to unit area). Columns: E_MeV, shape[, shape uncertainty].
obtained_from: https://github.com/michelelucente/PEANUTS, Data/ at commit 39ef11f
retrieved: 2026-10-28
method: table
license: public research data; cite the sources below
files:
