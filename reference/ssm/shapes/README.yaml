  n13_shape.csv: {source: "J. N. Bahcall and R. K. Ulrich, Rev. Mod. Phys. 60, 297 (1988)", endpoint_MeV: 1.199}
  o15_shape.csv: {source: "J. N. Bahcall and R. K. Ulrich, Rev. Mod. Phys. 60, 297 (1988)", endpoint_MeV: 1.732,
