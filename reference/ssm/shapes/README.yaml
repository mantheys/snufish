  hep_shape.csv: {source: "J. N. Bahcall, Phys. Rev. C 56, 3391 (1997)", endpoint_MeV: 18.784}
  8B_shape_Winter_et_al.csv: {source: "W. T. Winter et al., Phys. Rev. C 73, 025503 (2006)", columns: [E_MeV, shape, shape_uncertainty],
