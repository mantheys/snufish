# SNUfish benchmark B5: solar neutrino interaction rates per detector,
# channel and flux component, before detector response.
#
# SNUfish computes the rates for every B4 contribution (one set per tool and
# model) as
#   dR/dE = N_targets * Phi_c * s_c(E) * sum_alpha P_{e alpha}(E) sigma_alpha(E),
# with P_{e alpha} = sum_i F_i |U_{alpha i}|^2 from the B2 reference
# (daytime, production-averaged per component). Contributions to B5 itself
# are full-chain rate spectra from tools that do the folding themselves
# (e.g. SNOwGLoBES), compared with SNUfish's folding of the same inputs.
#
# Status: DRAFT.

id: B5_rates
version: 0.3.0
status: draft
title: Solar neutrino interaction rates

# Spectral shapes and lines (shared by every solar model); the flux of each
# component comes from the B1 solar model (benchmarks/B1_ssm/models.yaml).
fluxes:
  pp:  {shape: reference/ssm/shapes/pp_shape.csv}
  pep: {lines: [[1.442, 1.0]]}
  hep: {shape: reference/ssm/shapes/hep_shape.csv}
  Be7: {lines: [[0.8613, 0.8956], [0.3843, 0.1044]]}
  B8:  {shape: reference/ssm/shapes/8B_shape_Winter_et_al.csv}
  N13: {shape: reference/ssm/shapes/n13_shape.csv}
  O15: {shape: reference/ssm/shapes/o15_shape.csv}
  F17: {shape: reference/ssm/shapes/f17_shape.csv}

# Rates for every B1 model, each with the B2 reference oscillations of the
# same model (production-averaged, daytime).
solar_models: all
reference_solar_model: b16_gs98

oscillation:
  source: B2_sun reference, variant = the solar model, daytime

# Night and annual totals (SNUfish's folding only, B5_DayNight; contributions
# stay daytime): P_ee(night) = P_ee(day) + sum_i F_i R_i with the B3 night
# excess R_i = <P_ie>_night - |U_ei|^2 of each site, from the B3 tool named
# for each Earth model (the SNUfish reference). R_i is interpolated on
# the B3 exposure grid and zero below it (1 MeV); the rest of the flux is split
# between nu_mu and nu_tau as by day (equal ES cross sections). Annual =
# (day + night)/2, equal exposures; fluxes at 1 AU.
night:
  earth_models: {prem_prob3: snufish-reference, prem_four: nufast-earth, prem_full: nufast-earth}
  
exposure:
  kton_year: 1.0
  seconds_per_year: 3.15576e+7  # Julian year

# Targets per kton of detector material.
detectors:
  argon:
    description: liquid argon (natural, 99.60% 40Ar), M = 39.948 g/mol
    targets: {electron: 2.71349e+32, ar40: 1.50146e+31}
    channels: {es: electron, cc_nue_ar40: ar40}
  water:
    description: H2O, M = 18.015 g/mol, 99.757% 16O
    targets: {electron: 3.34285e+32, o16: 3.33472e+31}
    channels: {es: electron, cc_nue_o16: o16}

# `es` sums the three ES channels weighted with P_{e alpha}; CC channels use P_ee.
# Below `threshold_MeV` the cross section is zero by kinematics (missing
# table values there do not make a rate incomplete). Below the B4 grid
# (0.02 MeV) cross sections are taken as zero: < 0.01% of any rate.
channels:
  es: {flavours: {nue: es_nue, numu: es_numu, nutau: es_nutau}, threshold_MeV: 0.0}
  cc_nue_ar40: {flavours: {nue: cc_nue_ar40}, threshold_MeV: 1.504}   # M(40K) - M(40Ar), atomic masses
  cc_nue_o16:  {flavours: {nue: cc_nue_o16}, threshold_MeV: 15.4}     # 16F ground state

# Spectra (rate per MeV of neutrino energy) in two binnings; totals use `linear`.
spectrum_bins:
  linear: {kind: linear, start: 0.0, stop: 20.0, step: 0.1}
  log:    {kind: log, start: 0.05, stop: 20.0, per_decade: 40}

# Totals are reported over all energies and above these neutrino energies.
thresholds_MeV: [0.0, 5.0]

# Open questions:
# - The 8B shape table is truncated at 15.2 MeV (true endpoint ~16.5 MeV):
#   take the full Winter et al. tail before using rates above 15 MeV.
# - Observed spectra need detector response (the D library): smearing and efficiency.

# --- Contributions: full-chain rates from tools that fold fluxes themselves ---
# Each tool runs the same inputs (B1 fluxes and shapes, B2 reference daytime
# oscillations per component, its own cross sections) through its own chain;
# SNUfish compares the totals with its folding of that tool's B4 cross
# sections. Values are interactions per kton-year, before detector response.
# Solar model behind each tool's `native` flux, for the comparison.
native_solar_model: {snowglobes: bs05_op}

grids:
  totals:
    threshold: {start: 0.0, stop: 5.0, step: 5.0, unit: MeV}   # all energies; true E_nu > 5 MeV

variants:
  b16_gs98: {required: true, solar_model: b16_gs98, description: SNUfish inputs for B16-GS98.}
  bs05_op:  {required: false, solar_model: bs05_op, description: SNUfish inputs for BS05-OP.}
  b16_gs98_point_lines: {required: false, solar_model: b16_gs98, description: "B16-GS98 with each line written as one point of the tool's flux table (for tools whose sampling makes that unreliable)."}
  native:   {required: false, solar_model: null, description: "The tool's own built-in solar flux (describe in meta.yaml settings)."}

quantities:
  argon/es/pp: argon, es, pp
  argon/es/pep: argon, es, pep
  argon/es/hep: argon, es, hep
  argon/es/Be7: argon, es, Be7
  argon/es/B8: argon, es, B8
  argon/es/N13: argon, es, N13
  argon/es/O15: argon, es, O15
  argon/es/F17: argon, es, F17
  argon/es/all: argon, es, all
  argon/cc_nue_ar40/pp: argon, cc_nue_ar40, pp
  argon/cc_nue_ar40/pep: argon, cc_nue_ar40, pep
  argon/cc_nue_ar40/hep: argon, cc_nue_ar40, hep
  argon/cc_nue_ar40/Be7: argon, cc_nue_ar40, Be7
  argon/cc_nue_ar40/B8: argon, cc_nue_ar40, B8
  argon/cc_nue_ar40/N13: argon, cc_nue_ar40, N13
  argon/cc_nue_ar40/O15: argon, cc_nue_ar40, O15
  argon/cc_nue_ar40/F17: argon, cc_nue_ar40, F17
  argon/cc_nue_ar40/all: argon, cc_nue_ar40, all
  water/es/pp: water, es, pp
  water/es/pep: water, es, pep
  water/es/hep: water, es, hep
  water/es/Be7: water, es, Be7
  water/es/B8: water, es, B8
  water/es/N13: water, es, N13
  water/es/O15: water, es, O15
  water/es/F17: water, es, F17
  water/es/all: water, es, all
  water/cc_nue_o16/pp: water, cc_nue_o16, pp
  water/cc_nue_o16/pep: water, cc_nue_o16, pep
  water/cc_nue_o16/hep: water, cc_nue_o16, hep
  water/cc_nue_o16/Be7: water, cc_nue_o16, Be7
  water/cc_nue_o16/B8: water, cc_nue_o16, B8
  water/cc_nue_o16/N13: water, cc_nue_o16, N13
  water/cc_nue_o16/O15: water, cc_nue_o16, O15
  water/cc_nue_o16/F17: water, cc_nue_o16, F17
  water/cc_nue_o16/all: water, cc_nue_o16, all
all_quantities_required: false

columns:
  grid:      string, a key of `grids`
  variant:   string, a key of `variants`
  quantity:  string, detector/channel/component
  threshold: float, MeV of true neutrino energy
  value:     float, interactions per kton-year

checks:
  range: [0.0, 1.0e+9]
