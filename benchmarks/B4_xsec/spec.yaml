# SNUfish benchmark B4: cross sections of the solar neutrino detection channels.
#
# Each contribution gives sigma(E) per target for the channels the tool has,
# on a fixed energy grid. B5 folds them with the solar fluxes and the B2
# oscillations into event rates, one set of rates per contributed model.
#
# Status: DRAFT.

id: B4_xsec
version: 0.2.0
status: draft
compatible: [0.1.0]             # 0.2.0 adds optional quantities: 0.1.0 contributions stay valid
title: Cross sections of solar neutrino detection channels

quantities:                     # channels; target in brackets
  es_nue:      nu_e  + e- -> nu_e  + e-, all recoil energies [electron]
  es_numu:     nu_mu + e- -> nu_mu + e-, all recoil energies [electron]
  es_nutau:    nu_tau + e- -> nu_tau + e-, all recoil energies [electron]
  cc_nue_ar40: nu_e + 40Ar -> e- + 40K* [40Ar nucleus]
  cc_nue_o16:  nu_e + 16O -> e- + 16F [16O nucleus]
  cc_nue_c13:  nu_e + 13C -> e- + 13N [13C nucleus]
  cc_nue_d:    nu_e + d -> e- + p + p [deuteron]
  # ES above the electron-recoil thresholds of the B5 responses: sigma(E; T > T_min), the cross section
  # integrated over electron kinetic energies T from T_min to T_max(E) (zero where T_max <= T_min) [electron]
  es_nue_T0.05:   nu_e e-, T > 0.05 MeV (Borexino)
  es_numu_T0.05:  nu_mu e-, T > 0.05 MeV (Borexino)
  es_nutau_T0.05: nu_tau e-, T > 0.05 MeV (Borexino)
  es_nue_T2.0:    nu_e e-, T > 2.0 MeV (JUNO)
  es_numu_T2.0:   nu_mu e-, T > 2.0 MeV (JUNO)
  es_nutau_T2.0:  nu_tau e-, T > 2.0 MeV (JUNO)
  es_nue_T3.49:   nu_e e-, T > 3.49 MeV (Super-K IV)
  es_numu_T3.49:  nu_mu e-, T > 3.49 MeV (Super-K IV)
  es_nutau_T3.49: nu_tau e-, T > 3.49 MeV (Super-K IV)
  es_nue_T5.0:    nu_e e-, T > 5.0 MeV (DUNE)
  es_numu_T5.0:   nu_mu e-, T > 5.0 MeV (DUNE)
  es_nutau_T5.0:  nu_tau e-, T > 5.0 MeV (DUNE)
  es_nue_T5.5:    nu_e e-, T > 5.5 MeV (SNO salt)
  es_numu_T5.5:   nu_mu e-, T > 5.5 MeV (SNO salt)
  es_nutau_T5.5:  nu_tau e-, T > 5.5 MeV (SNO salt)
all_quantities_required: false  # a tool contributes the channels it has

grids:
  map:
    energy: {start: 0.02, stop: 20.0, step: 0.02, unit: MeV}   # 1000 points; fine enough for pp (endpoint 0.42 MeV)

# `default` is the tool's own choice for every channel it provides. Named
# model variants carry alternative calculations of one channel, so that the
# spread between nuclear models shows next to the spread between tools.
variants:
  default:
    required: true
    description: The tool's default cross section for each channel it provides.
  es_bks:
    required: false
    quantities: [es_nue, es_numu, es_nutau, es_nue_T0.05, es_numu_T0.05, es_nutau_T0.05, es_nue_T2.0, es_numu_T2.0,
                 es_nutau_T2.0, es_nue_T3.49, es_numu_T3.49, es_nutau_T3.49, es_nue_T5.0, es_numu_T5.0, es_nutau_T5.0,
                 es_nue_T5.5, es_numu_T5.5, es_nutau_T5.5]
    description: >-
      ES with electroweak, QCD and QED radiative corrections, Bahcall, Kamionkowski & Sirlin, PRD 51, 6146 (1995),
      all recoil energies or above the threshold in the name (the photon of nu e -> nu e gamma undetected; T is
      the electron's kinetic energy); sin^2 theta_W(m_Z) = 0.2317 as in BKS.
  ar40_klmv:
    required: false
    quantities: [cc_nue_ar40]
    description: KLMV (Kolbe, Langanke, Martinez-Pinedo, Vogel), as tabulated by SNOwGLoBES (xs_nue_Ar40_klmv.dat).
  ar40_marley:
    required: false
    quantities: [cc_nue_ar40]
    description: >-
      MARLEY (arXiv:2101.11867, allowed approximation) with B(GT) from 40Ar(p,n), Bhattacharya et al.,
      PRC 80, 055501 (2009); SNOwGLoBES xs_nue_Ar40_marley.dat (= its marley2), zero below 5 MeV.
  ar40_marley1:
    required: false
    quantities: [cc_nue_ar40]
    description: >-
      MARLEY with B(GT) from 40Ti beta decay (SNOwGLoBES commit 072d2bd, 2018: "marley1 is based on 40Ti
      measurements"); SNOwGLoBES xs_nue_Ar40_marley1.dat, zero below 5 MeV.
  ar40_marley2_bhattacharya2009:
    required: false
    quantities: [cc_nue_ar40]
    description: >-
      MARLEY 2.0.0 recommended model: HF-CRPA for the unbound continuum, measured B(GT) of Bhattacharya et al.,
      PRC 80, 055501 (2009) for bound 40K levels.
  ar40_marley2_liu1998:
    required: false
    quantities: [cc_nue_ar40]
    description: MARLEY 2.0.0, HF-CRPA + B(GT) from 40Ti beta decay, Liu et al., PRC 58, 2677 (1998).
  ar40_marley2_bhattacharya1998:
    required: false
    quantities: [cc_nue_ar40]
    description: MARLEY 2.0.0, HF-CRPA + B(GT) from 40Ti beta decay, Bhattacharya et al., PRC 58, 3677 (1998).
  ar40_marley1_bhattacharya2009:
    required: false
    quantities: [cc_nue_ar40]
    description: >-
      MARLEY's v1 reaction file (all levels from B(GT) of Bhattacharya et al. 2009, no HF-CRPA), run by
      MARLEY 2.0.0 with its default nucleon and nuclear form factors: SNOwGLoBES's xs_nue_Ar40_marley.dat
      above 5 MeV, down to threshold.
  ar40_marley1_allowed:
    required: false
    quantities: [cc_nue_ar40]
    description: >-
      The same reaction file in the allowed approximation (MARLEY 2.0.0, form_factors "allowed"): MARLEY
      v1.2.1's cross section, used by DUNE's MARLEY samples and SOLAR's neutrino_cc_final.txt.

constants:
  G_F_GeV-2: 1.1663788e-5       # PDG 2024
  hbarc_MeV_fm: 197.3269804     # CODATA 2018
  m_e_MeV: 0.51099895           # CODATA 2018
  sin2_theta_W: 0.23857         # PDG 2024, MS-bar at Q^2 -> 0 (used by the tree-level reference)

columns:
  grid:     string, a key of `grids`
  variant:  string, a key of `variants`
  quantity: string, a channel
  energy:   float, MeV
  value:    float, cm^2 per target; NaN where the tool has no value (outside its table)

checks:
  range: [0.0, 1.0e-30]
  allow_missing: true           # NaN allowed (outside a tool's table); never negative

# Versions (docs/compatibility.md). kind: initial, patch, minor (additive: old contributions stay valid) or
# major (old contributions are no longer valid).
changelog:
  - {version: 0.1.0, date: 2026-10-28, kind: initial, changes: "ES and CC channels on one energy grid. Optional variants added later without a bump (additive): the MARLEY 2 40Ar variants and ar40_marley1_bhattacharya2009 (2026-10-29), es_bks (2026-10-31), ar40_marley1_allowed (2026-11-07)."}
  - {version: 0.2.0, date: 2026-11-21, kind: minor, changes: "Optional quantities es_<flavour>_T<threshold>, sigma(E; T > T_min) at the B5 responses' ES thresholds (0.05, 2.0, 3.49, 5.0, 5.5 MeV); a variant's quantities list is the set a contribution may give, no longer the set it must give exactly (a relaxed check); the nu_e > nu_mu, nu_tau ordering check extends to each threshold where the cross section is not zero."}
