# SNUfish benchmark B2: MSW propagation in the Sun.
#
# Each contribution gives F_i(E, r0) = P(nu_e produced at radius r0 -> nu_i at
# the solar surface), the mass-eigenstate fractions that arrive at the Earth
# (incoherently: the Sun-Earth distance averages all phases). F_i is the
# phase-averaged value: the exact pointwise F_i carries O(1/gamma) terms
# (gamma ~ 1e3, the adiabaticity at the MSW resonance) that oscillate with the
# phase accumulated across the Sun and vanish over any energy resolution.
# For these parameters it equals the adiabatic |V_ei(r0)|^2 to O(1e-6). SNUfish averages
# them over each flux component's production profile and combines them with
# B3 into day and night P_ee and the day-night asymmetry.
#
# Status: DRAFT.

id: B2_sun
version: 0.2.0
status: draft
title: Mass-eigenstate fractions leaving the Sun
neutrinos_only: true

quantities:
  F1: P(nu_e at r0 -> nu_1 at the solar surface)
  F2: P(nu_e at r0 -> nu_2 at the solar surface)
  F3: P(nu_e at r0 -> nu_3 at the solar surface)

grids:
  map:
    energy:  {start: 0.1, stop: 20.0, step: 0.1, unit: MeV}   # 200 points: pp to hep
    radius:  {start: 0.0, stop: 0.3,  step: 0.005}            # r0 / R_sun, 61 points; 99% of every flux is below 0.27

# Same parameters and constants as B3 (NuFIT 6.0, normal ordering).
oscillation:
  sin2_theta12: 0.307
  sin2_theta13: 0.02195
  sin2_theta23: 0.561
  delta_cp_deg: 177.0
  dm2_21_eV2: 7.49e-5
  dm2_31_eV2: 2.534e-3
  ordering: normal

constants:
  G_F_GeV-2: 1.1663788e-5       # PDG 2024
  hbarc_MeV_fm: 197.3269804     # CODATA 2018
  N_A_mol-1: 6.02214076e+23

sun:
  radius_km: 695700.0           # IAU 2015 nominal solar radius
  path: radial                  # from r0 straight out to the surface

# Solar models: every model of the B1 registry (benchmarks/B1_ssm/models.yaml:
# n_e(r) and production profiles in SNUfish format), plus analytic profiles
# defined here. n_e is in N_A / cm^3, so V = sqrt(2) G_F N_A n_e.
solar_models:
  exponential:
    description: Bahcall's exponential approximation n_e = 245 exp(-10.54 r/R_sun).
    n0: 245.0
    scale: 10.54
    production_from: b16_gs98

variants:
  b16_gs98:
    required: true
    solar_model: b16_gs98
    description: B16-GS98, the tool comparison.
  b16_agss09met:
    required: false
    solar_model: b16_agss09met
    description: B1 model b16_agss09met.
  bs05_op:
    required: false
    solar_model: bs05_op
    description: B1 model bs05_op.
  bs05_agsop:
    required: false
    solar_model: bs05_agsop
    description: B1 model bs05_agsop.
  b23_gs98:
    required: false
    solar_model: b23_gs98
    description: B1 model b23_gs98.
  b23_agss09:
    required: false
    solar_model: b23_agss09
    description: B1 model b23_agss09.
  b23_c11:
    required: false
    solar_model: b23_c11
    description: B1 model b23_c11.
  b23_aag21:
    required: false
    solar_model: b23_aag21
    description: B1 model b23_aag21.
  b23_mb22m:
    required: false
    solar_model: b23_mb22m
    description: B1 model b23_mb22m.
  b23_mb22p:
    required: false
    solar_model: b23_mb22p
    description: B1 model b23_mb22p.
  exponential:
    required: false
    solar_model: exponential
    description: Analytic profile used in many textbook and fast calculations.

columns:
  grid:      string, a key of `grids`
  variant:   string, a key of `variants`
  quantity:  string, a key of `quantities`
  energy:    float, MeV
  radius:    float, r0 / R_sun
  value:     float, the probability

checks:
  range: [0.0, 1.0]
  unitarity_tolerance: 1.0e-6   # F1 + F2 + F3 = 1

# Open questions:
# - A validated non-adiabatic solver (e.g. adiabatic-basis integration with
#   phase averaging) to measure the O(1/gamma^2) corrections directly.
# - Radial path vs the true line of sight for off-centre production
#   (irrelevant while propagation is adiabatic; the reference measures it).
