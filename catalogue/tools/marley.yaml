id: marley
name: MARLEY
description: Monte Carlo event generator for tens-of-MeV neutrino interactions (Model of Argon Reaction Low Energy Yields); computes inclusive nu_e-40Ar charged-current cross sections, HF-CRPA for the continuum and measured B(GT) for bound levels in version 2, and ES on electrons; folds a user-given neutrino spectrum (flux-averaged cross section).
language: C++
license: GPL-3.0
repository: https://github.com/MARLEY-MC/marley
documentation: https://www.marleygen.org
reference: arXiv:2101.11867   # with Gardiner, Phys. Rev. C 103, 044604 (2021)
maintainers: null
benchmarks: [B4_xsec, B5_rates]
status: verified          # B4: contributions/marley/B4_xsec/2.0.0 (run_b4.py); B5: contributions/marley/B5_rates/2.0.0 (run_b5.py)
notes: >
  Version 2.0.0 (31 July 2026, Zenodo 10.5281/zenodo.21880925). Its discrete reaction files carry the
  measured B(GT) uncertainties (added 18 July 2026); the wrapper turns them into one shifted cross-section
  table per level (bgt_levels.parquet), so the B(GT) uncertainty of a rate is propagated exactly.
  Check against SNOwGLoBES's 2018 MARLEY table (xs_nue_Ar40_marley.dat, B(GT) of Bhattacharya 2009): MARLEY 2
  running its v1 model gives 46 % more at 10 MeV; without the g_A^2 = 1.26^2 factor its reaction file applies
  to the measured GT strengths, 6-9 % more at 8-15 MeV and 23 % at 6 MeV. The rest is the Coulomb factor:
  the allowed cross section from the same strengths reproduces the SNOwGLoBES table to 4-6 % without the
  Fermi function, and MARLEY's own table to 3 % with it (docs/crosschecks.md, "Investigated").
